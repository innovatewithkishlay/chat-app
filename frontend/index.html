<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="Touki: real-time chat with shared boards, notes, polls and voice & video calls in every conversation." />
  <meta name="theme-color" content="#FFFFFF" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" />
  <title>Touki | Chat, plan and call in one place</title>
  <script>
    // Apply the saved theme before first paint so there is no light flash
    // for dark-theme users while the app bundle loads.
    try {
      document.documentElement.setAttribute("data-theme", localStorage.getItem("chat-theme") || "light");
    } catch (e) {}
  </script>
</head>

<body>
  <div id="root">
    <!-- Static splash shown until React mounts (kept in sync with AppSplash.jsx). -->
    <div class="h-full w-full flex flex-col items-center justify-center gap-5 bg-white">
      <svg viewBox="0 0 32 32" class="size-12" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#18181B" />
        <path fill="#fff" d="M16 8c4.97 0 9 3.13 9 7.5S20.97 23 16 23c-.93 0-1.82-.1-2.66-.3L9 25l.86-3.6C8.1 20.05 7 17.9 7 15.5 7 11.13 11.03 8 16 8z" />
      </svg>
      <div class="h-1 w-24 overflow-hidden rounded-full bg-zinc-200" aria-hidden="true">
        <div class="h-full w-1/3 rounded-full bg-zinc-900 motion-safe:animate-splash-bar"></div>
      </div>
      <p class="text-sm text-zinc-500 min-h-[2.5rem]">Loading…</p>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
